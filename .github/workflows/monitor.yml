name: Monitor court docket
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      initialize:
        description: "Initialize state without sending historical alerts"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: court-docket-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore committed state
        run: test -f state/tracker.db || { mkdir -p state; touch state/.gitkeep; }
      - name: Run tracker
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DB_PATH: state/tracker.db
          SEND_LOW_IMPACT: "true"
        run: |
          if [ "${{ inputs.initialize }}" = "true" ]; then
            docket-tracker --initialize
          else
            docket-tracker
          fi
      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tracker.db
          git diff --cached --quiet || git commit -m "chore: update tracker state [skip ci]"
          git push
