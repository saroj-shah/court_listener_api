[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "court-docket-tracker"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docket-tracker = "docket_tracker.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
