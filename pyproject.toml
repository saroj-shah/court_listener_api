[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "court-docket-tracker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.11.7", "PyYAML==6.0.2", "pypdf==5.9.0", "python-dotenv==1.1.1"]

[project.scripts]
docket-tracker = "docket_tracker.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
